<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histui Package Example</title>
    <link rel="stylesheet" href="../src/styles.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f1412;
      }

      .demo {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100%;
        height: 100%;
      }

      .demo-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        border-bottom: 1px solid #35433b;
        background: #151b18;
        color: #edf2ea;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      .demo-field {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #9ba89d;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .demo-field select {
        padding: 5px 8px;
        border: 1px solid #35433b;
        border-radius: 8px;
        background: #202821;
        color: #edf2ea;
        font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }

      .demo-field select:disabled {
        opacity: 0.45;
      }

      .demo-hint {
        margin: 0;
        color: #9ba89d;
        font-size: 12px;
      }

      #timeline {
        width: 100%;
        height: 100%;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <header class="demo-bar">
        <label class="demo-field">
          Break label
          <select data-demo="break-label"></select>
        </label>
        <p class="demo-hint" data-demo="break-hint"></p>
      </header>
      <div id="timeline"></div>
    </main>
    <script type="module">
      import { createHistuiTimeline, TIME_BREAK_LABELS } from "../src/index.js";

      const data = {
        paststructVersion: "1.0",
        dataset: {
          id: "demo",
          title: { en: "Histui Package Demo", fa: "نمونه بسته هیستویی" },
          description: { en: "A tiny inline PastStruct dataset." },
          defaultLanguage: "en",
          languages: ["en", "fa"]
        },
        records: [
          {
            id: "event-0",
            recordType: "event",
            type: "cultural",
            label: { en: "Ancient Marker", fa: "نشانه باستانی" },
            description: { en: "A very old event, far away from the rest of the dataset." },
            emoji: "☥",
            temporal: { dates: [{ rank: 1, confidence: "probable", date: { from: "-2600" } }] },
            significance: { value: 9, scale: 10, scope: "global" }
          },
          {
            id: "period-0",
            recordType: "period",
            type: "cultural",
            label: { en: "Classical Era", fa: "دوره کلاسیک" },
            description: { en: "A period separated from the modern records by a long empty stretch." },
            emoji: "⌂",
            temporal: { dates: [{ rank: 1, confidence: "probable", date: { from: "-0480", to: "-0320" } }] },
            significance: { value: 8, scale: 10, scope: "global" }
          },
          {
            id: "event-1",
            recordType: "event",
            type: "political",
            label: { en: "Founding Event", fa: "رخداد آغازین" },
            description: { en: "The first event in the example timeline." },
            emoji: "◆",
            temporal: { dates: [{ rank: 1, confidence: "certain", date: { from: "1900-01-01" } }] },
            significance: { value: 8, scale: 10, scope: "local" }
          },
          {
            id: "period-1",
            recordType: "period",
            type: "cultural",
            label: { en: "Long Period", fa: "دوره بلند" },
            description: { en: "A longer historical period with a span." },
            emoji: "▰",
            temporal: { dates: [{ rank: 1, confidence: "probable", date: { from: "1915", to: "1945" } }] },
            significance: { value: 6, scale: 10, scope: "regional" }
          },
          {
            id: "event-2",
            recordType: "event",
            type: "scientific",
            label: { en: "Later Turning Point", fa: "نقطه عطف بعدی" },
            description: { en: "A later event connected to the same historical line." },
            emoji: "✦",
            temporal: { dates: [{ rank: 1, confidence: "certain", date: { from: "1979-02-11" } }] },
            significance: { value: 9, scale: 10, scope: "global" }
          },
          {
            id: "event-3",
            recordType: "event",
            type: "technological",
            label: { en: "Recent Milestone", fa: "نقطه اخیر" },
            description: { en: "A recent event that keeps the modern cluster dense." },
            emoji: "✷",
            temporal: { dates: [{ rank: 1, confidence: "certain", date: { from: "2011-03-11" } }] },
            significance: { value: 7, scale: 10, scope: "regional" }
          }
        ]
      };

      // Exposed so the demo can be driven from the console: histuiDemo.stepSelection(1)
      // or histuiDemo.setTimeBreakOptions({ label: "range" }) to try the break labels.
      window.histuiDemo = createHistuiTimeline({
        container: "#timeline",
        data,
        measurement: {
          enabled: true,
          transient: true,
          fadeOutMs: 1200
        },
        explodeEnabled: true,
        timeBreaksEnabled: true,
        onSelect(record) {
          console.log("Selected", record.id);
        },
        onTrack(name, payload) {
          // The built-in `Skip empty time` toggle reports through here, so the label
          // picker can grey out while breaks are off.
          if (name === "timeline_setting_change" && payload?.setting === "time-breaks") syncBreakLabel();
        }
      });

      const breakLabelHints = {
        gap: "Years between the records on either side of the cut.",
        removed: "Years taken off the axis: the gap minus the context a break keeps.",
        both: "Both numbers, removed first.",
        range: "The years the cut sits between, instead of a duration.",
        none: "Only the glyph. Hover a break for the numbers."
      };

      const breakLabelSelect = document.querySelector("[data-demo=break-label]");
      const breakLabelHint = document.querySelector("[data-demo=break-hint]");

      breakLabelSelect.innerHTML = TIME_BREAK_LABELS.map(
        (label) => `<option value="${label}">${label}</option>`
      ).join("");
      breakLabelSelect.value = window.histuiDemo.config.timeline.timeBreaks.label;
      breakLabelSelect.addEventListener("change", () => {
        window.histuiDemo.setTimeBreakOptions({ label: breakLabelSelect.value });
        syncBreakLabel();
      });
      syncBreakLabel();

      function syncBreakLabel() {
        const enabled = window.histuiDemo?.timeBreaksEnabled !== false;
        breakLabelSelect.disabled = !enabled;
        breakLabelHint.textContent = enabled
          ? breakLabelHints[breakLabelSelect.value]
          : "Turn on Skip empty time to see break labels.";
      }
    </script>
  </body>
</html>
